<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Shop - Retro Pixel Pet</title>
    <!-- 👻 幽灵 Emoji 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-links">
            <a href="index.html" data-en="Console" data-zh="主屏幕">主屏幕</a>
            <a href="garden.html" data-en="Garden" data-zh="菜园">菜园</a>
            <a href="shop.html" data-en="Shop" data-zh="商店">商店</a>
            <a href="editor.html" data-en="Draw" data-zh="画板">画板</a>
            <a href="chat.html" data-en="Chat" data-zh="对话">对话</a>
        </div>
    </header>
    <div class="console">
        <div class="screen" style="height: auto;">
            <h2 data-en="Item Shop" data-zh="兑换商店" style="text-align: center; font-size: 14px; margin-bottom: 10px; color: #3730a3;">兑换商店</h2>
            <div style="text-align: center; font-size: 12px; color: #3730a3; margin-bottom: 15px; font-weight: bold;">
                <span data-en="Your Carrots: " data-zh="你的胡萝卜： ">你的胡萝卜： </span>
                <span id="shop-carrot-count" style="color: #e67e22; font-weight: bold;">0</span> 🥕
            </div>
            <div class="shop-grid">
                <div class="shop-item">
                    <div class="item-icon">🍔</div>
                    <div class="item-name" data-en="Cyber Burger" data-zh="赛博汉堡">赛博汉堡</div>
                    <div class="item-price">2 🥕</div>
                    <button class="pixel-btn buy-btn" data-item="burger" style="font-size: 8px; padding: 8px;" data-en="Buy" data-zh="兑换">兑换</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon">🧸</div>
                    <div class="item-name" data-en="Pixel Toy" data-zh="像素玩具">像素玩具</div>
                    <div class="item-price">3 🥕</div>
                    <button class="pixel-btn buy-btn" data-item="toy" style="font-size: 8px; padding: 8px;" data-en="Buy" data-zh="兑换">兑换</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
