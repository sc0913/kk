<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Pet</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="nav-links">
            <a href="index.html" data-en="Console" data-zh="主屏幕">主屏幕</a>
            <a href="garden.html" data-en="Garden" data-zh="菜园">菜园</a>
            <a href="shop.html" data-en="Shop" data-zh="商店">商店</a>
            <a href="editor.html" data-en="Draw" data-zh="画板">画板</a>
            <a href="about.html" data-en="Manual" data-zh="说明书">说明书</a>
        </div>
    </header>

    <!-- 游戏机外壳 -->
    <div class="console">
        <div class="screen">
            <div class="status-bar">
                <span data-en="Hunger:" data-zh="饥饿:">饥饿:</span>
                <div class="bar"><div class="fill hunger-fill" id="hunger-bar"></div></div>
                <span data-en="Happy:" data-zh="快乐:">快乐:</span>
                <div class="bar"><div class="fill happy-fill" id="happy-bar"></div></div>
            </div>

            <div class="pet-display">
                <div id="pet-render-area" class="pet-render-area"></div>
            </div>
        </div>

        <div class="controls">
            <button class="pixel-btn" id="feed-btn" data-en="Feed 🍔" data-zh="喂食 🍔">喂食 🍔</button>
            <button class="pixel-btn" id="play-btn" data-en="Play 🎾" data-zh="玩耍 🎾">玩耍 🎾</button>
            <a href="editor.html" class="pixel-btn link-btn" data-en="Draw Pet 🎨" data-zh="画宠物 🎨">画宠物 🎨</a>
        </div>
    </div>

    <!-- 这里不再写 footer 标签，而是由 script.js 动态加载 -->
    <script src="script.js"></script>
</body>
</html>
