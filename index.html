<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Pet</title>
    <!-- 👻 幽灵 Emoji 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 拦截脚本：如果在本次会话中已经点过开始，就不再显示封面 -->
    <script>
        if (sessionStorage.getItem('gameStarted') === 'true') {
            document.body.classList.add('skip-cover');
        }
    </script>

    <!-- 开始游戏封面 -->
    <div id="start-screen" class="start-screen">
        <h1 class="game-title">Retro<br>Pixel Pet</h1>
        <div class="start-btn-wrapper">
            <button id="start-btn" class="pixel-btn start-btn">Press Start</button>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="main-game" class="main-game hidden">
        <header class="top-nav">
            <div class="nav-links">
                <a href="index.html" data-en="Console" data-zh="主屏幕">主屏幕</a>
                <a href="garden.html" data-en="Garden" data-zh="菜园">菜园</a>
                <a href="shop.html" data-en="Shop" data-zh="商店">商店</a>
                <a href="editor.html" data-en="Draw" data-zh="画板">画板</a>
                <a href="chat.html" data-en="Chat" data-zh="对话">对话</a>
            </div>
        </header>

        <div class="console">
            <div class="screen">
                <div class="status-bar">
                    <span data-en="Hunger:" data-zh="饥饿:">饥饿:</span>
                    <div class="bar"><div class="fill hunger-fill" id="hunger-bar"></div></div>
                    <span data-en="Happy:" data-zh="快乐:">快乐:</span>
                    <div class="bar"><div class="fill happy-fill" id="happy-bar"></div></div>
                </div>

                <div class="pet-display">
                    <div id="pet-bubble" class="pet-bubble hidden">😋</div>
                    <div id="pet-container" class="pet-render-area"></div>
                </div>
                
                <div class="inventory-bar">
                    <span>🍔 x <span id="burger-count">0</span></span>
                    <span>🧸 x <span id="toy-count">0</span></span>
                </div>
            </div>

            <div class="controls">
                <button class="pixel-btn" id="feed-btn" data-en="Feed 🍔 (-1)" data-zh="喂食 🍔 (-1)">喂食 🍔 (-1)</button>
                <button class="pixel-btn" id="play-btn" data-en="Play 🧸 (-1)" data-zh="玩耍 🧸 (-1)">玩耍 🧸 (-1)</button>
                <a href="editor.html" class="pixel-btn link-btn" data-en="Draw Pet 🎨" data-zh="画宠物 🎨">画宠物 🎨</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
