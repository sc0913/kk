<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Creator - Retro Pixel Pet</title>
    <!-- 👻 幽灵 Emoji 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-links">
            <a href="index.html" data-en="Console" data-zh="主屏幕">主屏幕</a>
            <a href="garden.html" data-en="Garden" data-zh="菜园">菜园</a>
            <a href="shop.html" data-en="Shop" data-zh="商店">商店</a>
            <a href="editor.html" data-en="Draw" data-zh="画板">画板</a>
            <a href="chat.html" data-en="Chat" data-zh="对话">对话</a>
        </div>
    </header>

    <div class="console">
        <div class="screen" style="height: auto;">
            <h2 data-en="Pet Creator" data-zh="宠物创造室" style="text-align: center; font-size: 14px; margin-bottom: 10px; color: #3730a3;">宠物创造室</h2>
            
            <div class="preset-area" style="text-align: center; margin-bottom: 15px;">
                <p style="font-size: 9px; color: #3730a3; margin-bottom: 10px; font-weight: bold;">不想画？选个现成的吧！(Choose a preset)</p>
                <div class="preset-buttons">
                    <button class="pixel-btn preset-btn" data-preset="alien">👾 外星人</button>
                    <button class="pixel-btn preset-btn" data-preset="cat">🐱 小猫咪</button>
                    <button class="pixel-btn preset-btn" data-preset="ghost">👻 小幽灵</button>
                </div>
            </div>

            <div class="editor-container">
                <div id="pixel-grid" class="pixel-grid"></div>
            </div>

            <div class="color-palette">
                <div class="color-swatch active" style="background-color: #000000;" data-color="#000000"></div>
                <div class="color-swatch" style="background-color: #ff0000;" data-color="#ff0000"></div>
                <div class="color-swatch" style="background-color: #00ff00;" data-color="#00ff00"></div>
                <div class="color-swatch" style="background-color: #0000ff;" data-color="#0000ff"></div>
                <div class="color-swatch" style="background-color: #ffff00;" data-color="#ffff00"></div>
                <div class="color-swatch" style="background-color: #ff00ff;" data-color="#ff00ff"></div>
                <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
                <div class="color-swatch eraser" data-color="transparent">🧽</div>
            </div>

            <div class="controls" style="margin-top: 15px;">
                <button class="pixel-btn" id="save-pet-btn" data-en="Save Pet" data-zh="保存宠物">保存宠物</button>
                <button class="pixel-btn" id="clear-btn" style="background-color: #fca5a5; color: #7f1d1d;" data-en="Clear" data-zh="清空">清空</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
