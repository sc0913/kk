<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Garden - Retro Pixel Pet</title>
    <!-- 👻 幽灵 Emoji 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-links">
            <a href="index.html" data-en="Console" data-zh="主屏幕">主屏幕</a>
            <a href="garden.html" data-en="Garden" data-zh="菜园">菜园</a>
            <a href="shop.html" data-en="Shop" data-zh="商店">商店</a>
            <a href="editor.html" data-en="Draw" data-zh="画板">画板</a>
            <a href="chat.html" data-en="Chat" data-zh="对话">对话</a>
        </div>
    </header>
    <div class="console">
        <div class="screen" style="height: auto;">
            <h2 data-en="Pixel Garden" data-zh="像素菜园" style="text-align: center; font-size: 14px; margin-bottom: 10px; color: #3730a3;">像素菜园</h2>
            <div style="text-align: center; font-size: 12px; color: #3730a3; margin-bottom: 15px; font-weight: bold;">
                <span data-en="Carrots: " data-zh="胡萝卜数量： ">胡萝卜数量： </span>
                <span id="carrot-count" style="color: #e67e22; font-weight: bold;">0</span> 🥕
            </div>
            <div class="garden-grid">
                <div class="plot" data-index="0"></div>
                <div class="plot" data-index="1"></div>
                <div class="plot" data-index="2"></div>
                <div class="plot" data-index="3"></div>
            </div>
            <p style="font-size: 8px; text-align: center; color: #3730a3; margin-top: 15px; font-weight: bold;" data-en="Click to plant & water!" data-zh="点击土地：播种 -> 浇水 -> 收获！">点击土地：播种 -> 浇水 -> 收获！</p>
        </div>
    </div>
    <script src="script.js"></script>
